<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live TV - Admin Panel</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #ffffff; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #1f1f1f; padding: 25px; border-radius: 12px; border: 1px solid #333; }
    h2 { margin-bottom: 20px; text-align: center; color: #ff3b30; }
    h4 { margin-bottom: 10px; color: #fff; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #aaa; }
    .form-group input { width: 100%; padding: 10px; background: #121212; border: 1px solid #333; color: #fff; border-radius: 6px; outline: none; }
    .form-group input:focus { border-color: #ff3b30; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-success { background: #28a745; color: #fff; }
    .btn-success:hover { background: #218838; }
    hr { border-color: #333; margin: 20px 0; }
    .admin-list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #121212; border-radius: 6px; margin-bottom: 10px; font-size: 0.9rem; border: 1px solid #2a2a2a; }
    .delete-icon { color: #ff3b30; cursor: pointer; font-size: 1.1rem; }
    .delete-icon:hover { color: #e02d22; }
  </style>
</head>
<body>

  <div class="container">
    <h2><i class="fa-solid fa-user-shield"></i> Admin Panel</h2>

    <!-- Link Add Form -->
    <div class="form-group">
      <h4>১. M3U Link যুক্ত করুন</h4>
      <label>ক্যাটাগরির নাম:</label>
      <input type="text" id="link-cat-name" placeholder="যেমন: Bangladesh, Sports">
      <br><br>
      <label>M3U URL Link:</label>
      <input type="text" id="link-cat-url" placeholder="https://example.com/playlist.m3u">
      <br><br>
      <button class="btn btn-success" onclick="addLinkCategory()">Add M3U Link</button>
    </div>

    <hr>

    <!-- File Upload Form -->
    <div class="form-group">
      <h4>২. Storage থেকে ফাইল আপলোড করুন</h4>
      <label>ক্যাটাগরির নাম:</label>
      <input type="text" id="file-cat-name" placeholder="যেমন: Local M3U Playlist">
      <br><br>
      <label>M3U / M3U8 ফাইল সিলেক্ট করুন:</label>
      <input type="file" id="file-cat-input" accept=".m3u,.m3u8">
      <br><br>
      <button class="btn btn-success" onclick="addFileCategory()">Upload File Category</button>
    </div>

    <hr>

    <h4>৩. বর্তমান ক্যাটাগরি তালিকা</h4>
    <div id="admin-category-list" style="margin-top: 15px;"></div>
  </div>

  <script>
    const defaultCategories = [
      { id: 'cat_1', type: 'link', name: 'Bangladesh', icon: 'fa-tv', data: 'https://iptv-org.github.io/iptv/countries/bd.m3u' },
      { id: 'cat_2', type: 'link', name: 'Sports', icon: 'fa-football', data: 'https://iptv-org.github.io/iptv/categories/sport.m3u' }
    ];

    function getCategories() {
      const saved = localStorage.getItem('live_tv_categories');
      return saved ? JSON.parse(saved) : defaultCategories;
    }

    function saveCategories(categories) {
      localStorage.setItem('live_tv_categories', JSON.stringify(categories));
      renderAdminCategoryList();
    }

    function renderAdminCategoryList() {
      const categories = getCategories();
      const adminCategoryList = document.getElementById('admin-category-list');
      adminCategoryList.innerHTML = "";

      if(categories.length === 0) {
        adminCategoryList.innerHTML = "<p style='color:#777;'>কোন ক্যাটাগরি নেই।</p>";
        return;
      }

      categories.forEach(cat => {
        const item = document.createElement('div');
        item.className = 'admin-list-item';
        item.innerHTML = `
          <span><b>${cat.name}</b> (${cat.type === 'link' ? 'Link' : 'Storage File'})</span>
          <i class="fa-solid fa-trash delete-icon" title="Delete Category" onclick="deleteCategory('${cat.id}')"></i>
        `;
        adminCategoryList.appendChild(item);
      });
    }

    function addLinkCategory() {
      const name = document.getElementById('link-cat-name').value.trim();
      const url = document.getElementById('link-cat-url').value.trim();

      if (!name || !url) {
        alert('ক্যাটাগরির নাম ও লিংক প্রদান করুন।');
        return;
      }

      const categories = getCategories();
      categories.push({
        id: 'cat_' + Date.now(),
        type: 'link',
        name: name,
        icon: 'fa-link',
        data: url
      });
      saveCategories(categories);
      
      document.getElementById('link-cat-name').value = '';
      document.getElementById('link-cat-url').value = '';
      alert('নতুন M3U লিংক সফলভাবে যোগ করা হয়েছে!');
    }

    function addFileCategory() {
      const name = document.getElementById('file-cat-name').value.trim();
      const fileInput = document.getElementById('file-cat-input');
      const file = fileInput.files[0];

      if (!name || !file) {
        alert('ক্যাটাগরির নাম দিন এবং ফাইল সিলেক্ট করুন।');
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        const categories = getCategories();
        categories.push({
          id: 'cat_' + Date.now(),
          type: 'content',
          name: name,
          icon: 'fa-folder-open',
          data: e.target.result
        });
        saveCategories(categories);

        document.getElementById('file-cat-name').value = '';
        fileInput.value = '';
        alert('ফাইল সফলভাবে যোগ হয়েছে!');
      };
      reader.readAsText(file);
    }

    function deleteCategory(catId) {
      if (confirm('ক্যাটাগরিটি ডিলিট করতে চান?')) {
        let categories = getCategories();
        categories = categories.filter(c => c.id !== catId);
        saveCategories(categories);
      }
    }

    document.addEventListener('DOMContentLoaded', renderAdminCategoryList);
  </script>
</body>
</html>
