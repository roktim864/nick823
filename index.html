<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA TV PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#e50914',
            darkBg: '#121212',
            cardDark: '#1e1e1e'
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Plyr CSS and JS -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

  <style>
    body { overflow-x: hidden; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
    ::-webkit-scrollbar-thumb { background: #e50914; border-radius: 4px; }

    .theme-icon-rotate {
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dark .theme-icon-rotate {
      transform: rotate(360deg);
    }

    .custom-radio {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #71717a;
      border-radius: 50%;
      outline: none;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }
    .custom-radio:checked {
      border-color: #e50914;
    }
    .custom-radio:checked::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 8px; height: 8px;
      background-color: #e50914;
      border-radius: 50%;
    }

    /* Plyr custom accent color matching brand */
    :root {
      --plyr-color-main: #e50914;
    }
    .plyr {
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-darkBg dark:text-slate-100 flex flex-col font-sans transition-colors duration-300 min-h-screen">

  <!-- Fixed Header -->
  <header class="border-b border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-4 py-2 flex items-center justify-between shrink-0 sticky top-0 z-50">
    <div class="bg-brand text-white font-black text-sm px-2.5 py-0.5 rounded-lg tracking-wider">
      NOVA<span class="text-amber-400">PRO</span>
    </div>

    <div class="flex items-center gap-3">
      <button id="themeToggleBtn" aria-label="Toggle Theme" class="relative w-12 h-6 bg-slate-300 dark:bg-zinc-700 rounded-full p-1 transition-colors duration-300 flex items-center focus:outline-none">
        <div id="themeToggleThumb" class="w-4 h-4 rounded-full bg-white dark:bg-amber-400 shadow-md transform transition-transform duration-300 flex items-center justify-center translate-x-0 dark:translate-x-6">
          <i id="themeIcon" data-lucide="sun" class="w-3 h-3 text-amber-500 dark:text-zinc-900 theme-icon-rotate"></i>
        </div>
      </button>

      <button id="adminBtn" class="flex items-center gap-1.5 bg-slate-200 dark:bg-zinc-800 hover:bg-slate-300 dark:hover:bg-zinc-700 px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-300 dark:border-zinc-700">
        <i data-lucide="shield" class="w-3.5 h-3.5 text-brand"></i>
        <span>Admin Panel</span>
      </button>
    </div>
  </header>

  <!-- Sticky Video Player Section -->
  <div class="sticky top-[45px] z-40 bg-black shadow-2xl border-b border-zinc-800">
    <div class="max-w-4xl mx-auto w-full">
      <div id="playerContainer" class="aspect-video w-full bg-black relative flex items-center justify-center max-h-[40vh] sm:max-h-[50vh]">
        <video id="videoPlayer" class="w-full h-full object-contain" autoplay crossorigin="anonymous" playsinline></video>
      </div>
      
      <!-- Video Info Control Bar -->
      <div class="bg-slate-900 px-4 py-2 flex items-center justify-between border-t border-zinc-800">
        <div class="flex items-center gap-2 overflow-hidden">
          <div class="w-2 h-2 rounded-full bg-red-600 animate-ping shrink-0"></div>
          <h2 id="currentChannelInfo" class="text-xs font-bold truncate text-white">Select a Channel</h2>
        </div>
        
        <div class="flex items-center gap-2 shrink-0">
          <button id="fullscreenBtn" class="flex items-center gap-1 bg-brand hover:bg-red-700 text-white px-3 py-1 rounded-lg text-xs font-semibold">
            <i data-lucide="maximize" class="w-3.5 h-3.5"></i>
            <span>Fullscreen</span>
          </button>
          
          <button id="openSettingsModalBtn" class="flex items-center gap-1 bg-zinc-800 hover:bg-zinc-700 text-white px-3 py-1 rounded-lg text-xs border border-zinc-700">
            <i data-lucide="settings" class="w-3.5 h-3.5 text-slate-400"></i>
            <span>Settings</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="max-w-4xl w-full mx-auto p-4 flex flex-col gap-4">

    <!-- Playlist Selector Horizontal Bar -->
    <div>
      <span class="text-[11px] font-bold text-slate-400 mb-1.5 block uppercase tracking-wider">Loaded Playlists</span>
      <div id="categoryGrid" class="flex gap-2 overflow-x-auto pb-1 scrollbar-none"></div>
    </div>

    <!-- Search Input -->
    <div class="relative">
      <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-2.5 text-slate-400"></i>
      <input type="text" id="searchInput" placeholder="Search channels..." class="w-full bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl pl-10 pr-4 py-2 text-xs outline-none focus:ring-1 focus:ring-brand">
    </div>

    <!-- Header: Channels -->
    <h3 id="channelHeaderTitle" class="text-lg font-bold text-slate-900 dark:text-white mt-1">
      Channels
    </h3>

    <!-- Category Pills Horizontal Scroll -->
    <div id="subCategoryPills" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none"></div>

    <!-- Channels Grid View -->
    <div id="channelsGrid" class="grid grid-cols-2 gap-3 pb-10"></div>

  </div>

  <!-- SETTINGS MODAL -->
  <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-[#1c1c1e] text-white w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl border border-zinc-800">
      <div class="flex justify-between items-center px-5 py-3.5 border-b border-zinc-800">
        <h2 class="text-sm font-bold">Video Settings</h2>
        <button id="closeSettingsModalBtn" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>

      <div class="flex border-b border-zinc-800 text-xs font-bold text-slate-400">
        <button id="tabVideo" class="flex-1 py-2.5 border-b-2 border-brand text-brand text-center">VIDEO</button>
        <button id="tabAudio" class="flex-1 py-2.5 text-center hover:text-slate-200">AUDIO</button>
        <button id="tabText" class="flex-1 py-2.5 text-center hover:text-slate-200">TEXT</button>
        <button id="tabSpeed" class="flex-1 py-2.5 text-center hover:text-slate-200">SPEED</button>
      </div>

      <div class="p-4 max-h-[320px] overflow-y-auto space-y-3">
        <div id="contentVideo" class="space-y-3">
          <label class="flex items-center justify-between cursor-pointer py-1">
            <span class="text-xs font-bold text-slate-100">Auto</span>
            <input type="radio" name="videoQualityOption" value="auto" class="custom-radio" checked>
          </label>
          <div id="dynamicQualityList" class="space-y-3 border-t border-zinc-800 pt-2"></div>
        </div>

        <div id="contentAudio" class="hidden space-y-3">
          <label class="flex items-center justify-between cursor-pointer py-1">
            <div>
              <span class="text-xs font-bold block text-slate-100">Auto</span>
              <span class="text-[10px] text-slate-400">Automatic audio</span>
            </div>
            <input type="radio" name="audioOption" value="auto" class="custom-radio" checked>
          </label>
          <label class="flex items-center justify-between cursor-pointer py-1">
            <div>
              <span class="text-xs font-bold block text-slate-100">None</span>
              <span class="text-[10px] text-slate-400">No audio</span>
            </div>
            <input type="radio" name="audioOption" value="none" class="custom-radio">
          </label>
          <div id="dynamicAudioList" class="space-y-3 border-t border-zinc-800 pt-2"></div>
        </div>

        <div id="contentText" class="hidden space-y-3">
          <label class="flex items-center justify-between cursor-pointer py-1">
            <span class="text-xs font-bold text-slate-100">Auto</span>
            <input type="radio" name="textOption" value="auto" class="custom-radio" checked>
          </label>
          <label class="flex items-center justify-between cursor-pointer py-1">
            <span class="text-xs font-bold text-slate-100">None</span>
            <input type="radio" name="textOption" value="none" class="custom-radio">
          </label>
          <div id="dynamicTextList" class="space-y-3 border-t border-zinc-800 pt-2"></div>
        </div>

        <div id="contentSpeed" class="hidden space-y-3">
          <label class="flex items-center justify-between cursor-pointer py-1">
            <div>
              <span class="text-xs font-bold block text-slate-100">0.25x</span>
              <span class="text-[10px] text-slate-400">Playback speed</span>
            </div>
            <input type="radio" name="speedOption" value="0.25" class="custom-radio">
          </label>
          <label class="flex items-center justify-between cursor-pointer py-1">
            <div>
              <span class="text-xs font-bold block text-slate-100">0.5x</span>
              <span class="text-[10px] text-slate-400">Playback speed</span>
            </div>
            <input type="radio" name="speedOption" value="0.5" class="custom-radio">
          </label>
          <label class="flex items-center justify-between cursor-pointer py-1">
            <div>
              <span class="text-xs font-bold block text-slate-100">0.75x</span>
              <span class="text-[10px] text-slate-400">Playback speed</span>
            </div>
            <input type="radio" name="speedOption" value="0.75" class="custom-radio">
          </label>
          <label class="flex items-center justify-between cursor-pointer py-1">
            <div>
              <span class="text-xs font-bold block text-slate-100">1.0x</span>
              <span class="text-[10px] text-slate-400">Playback speed</span>
            </div>
            <input type="radio" name="speedOption" value="1.0" class="custom-radio" checked>
          </label>
          <label class="flex items-center justify-between cursor-pointer py-1">
            <div>
              <span class="text-xs font-bold block text-slate-100">1.25x</span>
              <span class="text-[10px] text-slate-400">Playback speed</span>
            </div>
            <input type="radio" name="speedOption" value="1.25" class="custom-radio">
          </label>
          <label class="flex items-center justify-between cursor-pointer py-1">
            <div>
              <span class="text-xs font-bold block text-slate-100">1.5x</span>
              <span class="text-[10px] text-slate-400">Playback speed</span>
            </div>
            <input type="radio" name="speedOption" value="1.5" class="custom-radio">
          </label>
          <label class="flex items-center justify-between cursor-pointer py-1">
            <div>
              <span class="text-xs font-bold block text-slate-100">2.0x</span>
              <span class="text-[10px] text-slate-400">Playback speed</span>
            </div>
            <input type="radio" name="speedOption" value="2.0" class="custom-radio">
          </label>
        </div>
      </div>

      <div class="flex justify-end gap-6 px-5 py-3 border-t border-zinc-800 text-xs font-bold">
        <button id="cancelSettingsBtn" class="text-slate-400 hover:text-white">CANCEL</button>
        <button id="applySettingsBtn" class="text-brand hover:opacity-80">APPLY</button>
      </div>
    </div>
  </div>

  <!-- ADMIN MODAL -->
  <div id="adminModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 w-full max-w-md rounded-2xl p-5 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button id="closeAdminBtn" class="absolute top-4 right-4 text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>

      <h2 class="text-sm font-bold mb-4 flex items-center gap-2"><i data-lucide="shield" class="text-brand"></i> Admin Panel</h2>

      <div class="mb-4 bg-slate-50 dark:bg-zinc-800/50 p-3 rounded-xl border border-slate-200 dark:border-zinc-800 space-y-2">
        <label class="text-xs font-bold text-slate-400 block">Add M3U/M3U8 Playlist URL</label>
        <input type="text" id="m3uNameInput" placeholder="Playlist Name (e.g. Playlist 5)" class="w-full bg-white dark:bg-zinc-900 border border-slate-300 dark:border-zinc-700 rounded-lg px-3 py-1.5 text-xs outline-none">
        <input type="text" id="m3uUrlInput" placeholder="M3U URL (https://...)" class="w-full bg-white dark:bg-zinc-900 border border-slate-300 dark:border-zinc-700 rounded-lg px-3 py-1.5 text-xs outline-none">
        <button id="addUrlBtn" class="w-full bg-brand text-white py-1.5 rounded-lg text-xs font-bold">Add URL Playlist</button>
      </div>

      <div class="mb-4 bg-slate-50 dark:bg-zinc-800/50 p-3 rounded-xl border border-slate-200 dark:border-zinc-800 space-y-2">
        <label class="text-xs font-bold text-slate-400 block">Upload M3U/M3U8 File</label>
        <input type="text" id="fileNameInput" placeholder="Playlist Name (Optional)" class="w-full bg-white dark:bg-zinc-900 border border-slate-300 dark:border-zinc-700 rounded-lg px-3 py-1.5 text-xs outline-none">
        <input type="file" id="fileUploadInput" accept=".m3u,.m3u8" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-zinc-700 file:text-white cursor-pointer">
      </div>

      <div class="border-t border-zinc-800 pt-3">
        <label class="text-xs font-bold text-slate-400 block mb-2">Saved Playlists</label>
        <div id="uploadedFilesList" class="max-h-36 overflow-y-auto space-y-1.5"></div>
      </div>
    </div>
  </div>

  <script>
    let userUploadedFiles = JSON.parse(localStorage.getItem('nova_user_files')) || [];
    let hls = new Hls();
    const video = document.getElementById('videoPlayer');
    const playerContainer = document.getElementById('playerContainer');
    let selectedFileId = userUploadedFiles.length > 0 ? userUploadedFiles[0].id : null;
    let selectedSubCategory = "All";
    let activeChannelId = null;

    // Initialize Plyr Video Player
    const player = new Plyr(video, {
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
      fullscreen: { enabled: true, fallback: true, iosNative: true }
    });

    lucide.createIcons();

    // Fullscreen and Orientation Lock Setup
    async function toggleFullscreenAndLock() {
      try {
        if (!player.fullscreen.active) {
          player.fullscreen.enter();
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape').catch(e => console.log(e));
          }
        } else {
          player.fullscreen.exit();
        }
      } catch (err) {
        console.error("Fullscreen error:", err);
      }
    }

    document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreenAndLock);

    player.on('enterfullscreen', async () => {
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock('landscape').catch(e => console.log(e));
      }
    });

    player.on('exitfullscreen', () => {
      if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
    });

    // Theme Logic
    const themeBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');

    function updateThemeUI(isDark) {
      if (isDark) {
        document.documentElement.classList.add('dark');
        themeIcon.setAttribute('data-lucide', 'moon');
      } else {
        document.documentElement.classList.remove('dark');
        themeIcon.setAttribute('data-lucide', 'sun');
      }
      lucide.createIcons();
    }

    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('nova_theme', isDark ? 'dark' : 'light');
      updateThemeUI(isDark);
    });

    const savedTheme = localStorage.getItem('nova_theme') || 'dark';
    updateThemeUI(savedTheme === 'dark');

    function parseM3UText(m3uText) {
      const lines = m3uText.split('\n');
      let currentName = "", currentLogo = "", currentGroup = "General";
      const channels = [];

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          if (logoMatch) currentLogo = logoMatch[1];

          const groupMatch = line.match(/group-title="([^"]+)"/);
          if (groupMatch) currentGroup = groupMatch[1];

          const nameParts = line.split(',');
          if (nameParts.length > 1) currentName = nameParts[nameParts.length - 1].trim();
        } else if (line.startsWith('http')) {
          if (currentName && line) {
            channels.push({
              id: Date.now() + Math.random(),
              name: currentName,
              logo: currentLogo || 'https://images.unsplash.com/photo-1593784991095-a205069470b6?w=100&auto=format&fit=crop&q=60',
              group: currentGroup || 'General',
              url: line
            });
          }
          currentName = ""; currentLogo = ""; currentGroup = "General";
        }
      });
      return channels;
    }

    function renderCategoryCards() {
      const container = document.getElementById('categoryGrid');
      container.innerHTML = '';

      if (userUploadedFiles.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 py-1">Admin Panel থেকে ফাইল/লিংক যুক্ত করুন।</p>`;
        renderChannels();
        return;
      }

      userUploadedFiles.forEach(fileObj => {
        const isSelected = selectedFileId === fileObj.id;
        const card = document.createElement('div');
        card.className = `px-3.5 py-1.5 rounded-lg flex items-center gap-2 cursor-pointer border shrink-0 transition text-xs font-semibold ${
          isSelected 
            ? 'bg-brand text-white border-brand shadow-sm' 
            : 'bg-white dark:bg-zinc-800 border-slate-200 dark:border-zinc-700 text-slate-800 dark:text-slate-300'
        }`;

        card.innerHTML = `<i data-lucide="folder" class="w-3.5 h-3.5"></i> ${fileObj.name}`;

        card.onclick = () => {
          selectedFileId = fileObj.id;
          selectedSubCategory = "All";
          renderCategoryCards();
          renderChannels();
        };

        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function renderChannels(filterQuery = "") {
      const gridContainer = document.getElementById('channelsGrid');
      const pillsContainer = document.getElementById('subCategoryPills');
      gridContainer.innerHTML = "";
      pillsContainer.innerHTML = "";

      const activeFile = userUploadedFiles.find(f => f.id === selectedFileId);
      if (!activeFile || !activeFile.channels || activeFile.channels.length === 0) {
        document.getElementById('channelHeaderTitle').innerText = `Channels`;
        gridContainer.innerHTML = `<p class="text-xs text-center text-slate-400 col-span-2 py-6">কোনো চ্যানেল পাওয়া যায়নি।</p>`;
        return;
      }

      document.getElementById('channelHeaderTitle').innerText = `Channels (${activeFile.name} - ${activeFile.channels.length})`;

      const groups = ["All"];
      activeFile.channels.forEach(ch => {
        const grp = ch.group || "General";
        if (!groups.includes(grp)) groups.push(grp);
      });

      groups.sort((a, b) => {
        if (a === "All") return -1;
        if (b === "All") return 1;
        return a.localeCompare(b, undefined, { sensitivity: 'base', numeric: true });
      });

      groups.forEach(grp => {
        const isSelected = selectedSubCategory === grp;
        const btn = document.createElement('button');
        btn.className = `px-4 py-1.5 rounded-full text-xs font-semibold transition shrink-0 ${
          isSelected 
            ? 'bg-red-600 text-white shadow-md' 
            : 'bg-slate-200 dark:bg-zinc-800/80 text-slate-700 dark:text-zinc-400 hover:bg-slate-300 dark:hover:bg-zinc-700'
        }`;
        btn.innerText = grp;
        btn.onclick = () => {
          selectedSubCategory = grp;
          renderChannels(document.getElementById('searchInput').value);
        };
        pillsContainer.appendChild(btn);
      });

      const filteredChannels = activeFile.channels
        .filter(ch => {
          const matchesCategory = (selectedSubCategory === "All" || (ch.group || "General") === selectedSubCategory);
          const matchesSearch = ch.name.toLowerCase().includes(filterQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        })
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base', numeric: true }));

      if (filteredChannels.length === 0) {
        gridContainer.innerHTML = `<p class="text-xs text-center text-slate-400 col-span-2 py-6">কোনো চ্যানেল নেই।</p>`;
        return;
      }

      filteredChannels.forEach(ch => {
        const isActive = ch.id === activeChannelId;
        const card = document.createElement('div');
        card.className = `bg-white dark:bg-[#1a1a1a] border rounded-xl p-4 flex flex-col items-center justify-center text-center cursor-pointer transition ${
          isActive ? 'border-red-600 ring-1 ring-red-600' : 'border-slate-200 dark:border-zinc-800/80 hover:border-slate-400 dark:hover:border-zinc-700'
        }`;

        card.onclick = () => {
          activeChannelId = ch.id;
          renderChannels(document.getElementById('searchInput').value);
          playChannel(ch);
        };

        const resText = ch.name.includes('(') ? '' : ' (720p)';

        card.innerHTML = `
          <div class="w-16 h-12 bg-slate-100 dark:bg-black/60 rounded-lg flex items-center justify-center p-1 mb-3">
            <img src="${ch.logo}" alt="${ch.name}" class="max-w-full max-h-full object-contain" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1593784991095-a205069470b6?w=100&auto=format&fit=crop&q=60';">
          </div>
          <h4 class="text-xs font-bold text-slate-800 dark:text-white tracking-wide truncate w-full">${ch.name}${resText}</h4>
        `;

        gridContainer.appendChild(card);
      });
    }

    function playChannel(channel) {
      document.getElementById('currentChannelInfo').innerText = channel.name;

      if (Hls.isSupported()) {
        hls.destroy();
        hls = new Hls();
        hls.loadSource(channel.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          populateModalOptions();
          player.play();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = channel.url;
        player.play();
      }
    }

    function populateModalOptions() {
      const vidContainer = document.getElementById('dynamicQualityList');
      const audioContainer = document.getElementById('dynamicAudioList');
      const textContainer = document.getElementById('dynamicTextList');
      
      vidContainer.innerHTML = ""; 
      audioContainer.innerHTML = "";
      textContainer.innerHTML = "";

      if (hls && hls.levels && hls.levels.length > 0) {
        hls.levels.forEach((level, idx) => {
          const w = level.width || 1280, h = level.height || 720;
          const mbps = level.bitrate ? (level.bitrate / 1000000).toFixed(2) : "2.00";
          const item = document.createElement('label');
          item.className = "flex items-center justify-between cursor-pointer py-1";
          item.innerHTML = `
            <span class="text-xs font-bold text-slate-100">${w} × ${h} • ${mbps} Mbps</span>
            <input type="radio" name="videoQualityOption" value="${idx}" class="custom-radio">
          `;
          vidContainer.appendChild(item);
        });
      }

      if (hls && hls.audioTracks && hls.audioTracks.length > 0) {
        hls.audioTracks.forEach((track, idx) => {
          const lang = track.name || `Track ${idx + 1}`;
          const bitrate = track.bitrate ? `${Math.round(track.bitrate / 1000)} kbps` : '128 kbps';
          const item = document.createElement('label');
          item.className = "flex items-center justify-between cursor-pointer py-1";
          item.innerHTML = `
            <div>
              <span class="text-xs font-bold block text-slate-100">${lang}</span>
              <span class="text-[10px] text-slate-400">${bitrate}</span>
            </div>
            <input type="radio" name="audioOption" value="${idx}" class="custom-radio">
          `;
          audioContainer.appendChild(item);
        });
      }

      if (hls && hls.subtitleTracks && hls.subtitleTracks.length > 0) {
        hls.subtitleTracks.forEach((track, idx) => {
          const lang = track.name || track.lang || `Track ${idx + 1}`;
          const item = document.createElement('label');
          item.className = "flex items-center justify-between cursor-pointer py-1";
          item.innerHTML = `
            <span class="text-xs font-bold text-slate-100">${lang}</span>
            <input type="radio" name="textOption" value="${idx}" class="custom-radio">
          `;
          textContainer.appendChild(item);
        });
      }
    }

    const tabs = [
      { btn: 'tabVideo', content: 'contentVideo' },
      { btn: 'tabAudio', content: 'contentAudio' },
      { btn: 'tabText', content: 'contentText' },
      { btn: 'tabSpeed', content: 'contentSpeed' }
    ];

    tabs.forEach(tab => {
      document.getElementById(tab.btn).onclick = () => {
        tabs.forEach(t => {
          document.getElementById(t.btn).classList.remove('border-b-2', 'border-brand', 'text-brand');
          document.getElementById(t.btn).classList.add('text-slate-400');
          document.getElementById(t.content).classList.add('hidden');
        });
        document.getElementById(tab.btn).classList.add('border-b-2', 'border-brand', 'text-brand');
        document.getElementById(tab.btn).classList.remove('text-slate-400');
        document.getElementById(tab.content).classList.remove('hidden');
      };
    });

    const settingsModal = document.getElementById('settingsModal');
    document.getElementById('openSettingsModalBtn').onclick = () => settingsModal.classList.remove('hidden');
    document.getElementById('closeSettingsModalBtn').onclick = () => settingsModal.classList.add('hidden');
    document.getElementById('cancelSettingsBtn').onclick = () => settingsModal.classList.add('hidden');

    document.getElementById('applySettingsBtn').onclick = () => {
  // ১. ভিডিও কোয়ালিটি সেট করা
  const selectedQuality = document.querySelector('input[name="videoQualityOption"]:checked');
  if (selectedQuality && hls) {
    const val = selectedQuality.value;
    if (val === "auto") hls.currentLevel = -1;
    else hls.currentLevel = parseInt(val);
  }

  // ২. অডিও ভাষা পরিবর্তন (English/অন্যান্য)
  const selectedAudio = document.querySelector('input[name="audioOption"]:checked');
  if (selectedAudio && hls) {
    const val = selectedAudio.value;
    if (val === "auto") {
      hls.audioTrack = -1;
    } else if (val === "none") {
      video.muted = true;
    } else {
      video.muted = false;
      hls.audioTrack = parseInt(val); // এখানে অডিও ট্র্যাক সেট হচ্ছে
    }
  }

  // ৩. সাবটাইটেল বা টেক্সট (English Subtitles)
  const selectedText = document.querySelector('input[name="textOption"]:checked');
  if (selectedText && hls) {
    const val = selectedText.value;
    if (val === "none") {
      hls.subtitleTrack = -1; // সাবটাইটেল বন্ধ
      hls.subtitleDisplay = false;
    } else if (val === "auto") {
      hls.subtitleTrack = 0;
      hls.subtitleDisplay = true;
    } else {
      hls.subtitleTrack = parseInt(val); // নির্দিষ্ট সাবটাইটেল চালু
      hls.subtitleDisplay = true; // স্ক্রিনে লেখা দেখানোর জন্য এটি জরুরি
    }
  }

  // ৪. প্লেব্যাক স্পিড
  const selectedSpeed = document.querySelector('input[name="speedOption"]:checked');
  if (selectedSpeed) {
    player.speed = parseFloat(selectedSpeed.value);
  }

  settingsModal.classList.add('hidden');
};

    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderChannels(e.target.value);
    });

    const adminModal = document.getElementById('adminModal');
    document.getElementById('adminBtn').onclick = () => {
      adminModal.classList.remove('hidden');
      renderUploadedFilesList();
    };
    document.getElementById('closeAdminBtn').onclick = () => adminModal.classList.add('hidden');

    document.getElementById('addUrlBtn').onclick = async () => {
      const name = document.getElementById('m3uNameInput').value.trim();
      const url = document.getElementById('m3uUrlInput').value.trim();
      if (!name || !url) return alert("নাম এবং URL পূরণ করুন।");

      try {
        const res = await fetch(url);
        const txt = await res.text();
        const parsedChannels = parseM3UText(txt);
        
        const newFileObj = { id: Date.now(), name: name, channels: parsedChannels };
        userUploadedFiles.push(newFileObj);
        selectedFileId = newFileObj.id;

        localStorage.setItem('nova_user_files', JSON.stringify(userUploadedFiles));
        renderCategoryCards();
        renderChannels();
        renderUploadedFilesList();
        document.getElementById('m3uNameInput').value = "";
        document.getElementById('m3uUrlInput').value = "";
        alert("প্লেলিস্ট যুক্ত হয়েছে!");
      } catch (e) {
        alert("ডেটা আনা যায়নি।");
      }
    };

    document.getElementById('fileUploadInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      let name = document.getElementById('fileNameInput').value.trim();
      if (!name && file) name = file.name.replace(/\.[^/.]+$/, "");

      if (file) {
        const reader = new FileReader();
        reader.onload = function (event) {
          const parsedChannels = parseM3UText(event.target.result);
          const newFileObj = { id: Date.now(), name: name, channels: parsedChannels };
          
          userUploadedFiles.push(newFileObj);
          selectedFileId = newFileObj.id;

          localStorage.setItem('nova_user_files', JSON.stringify(userUploadedFiles));
          renderCategoryCards();
          renderChannels();
          renderUploadedFilesList();
          document.getElementById('fileNameInput').value = "";
          alert(`"${name}" ফাইল আপলোড হয়েছে!`);
        };
        reader.readAsText(file);
      }
    });

    function renderUploadedFilesList() {
      const list = document.getElementById('uploadedFilesList');
      list.innerHTML = '';
      if (userUploadedFiles.length === 0) {
        list.innerHTML = `<p class="text-xs text-slate-500 py-2 text-center">কোনো কাস্টম প্লেলিস্ট নেই।</p>`;
        return;
      }
      userUploadedFiles.forEach(fileObj => {
        const item = document.createElement('div');
        item.className = "flex justify-between items-center text-xs p-2 bg-slate-100 dark:bg-zinc-800 rounded-lg";
        item.innerHTML = `
          <div class="overflow-hidden pr-2">
            <span class="font-bold block truncate text-slate-800 dark:text-slate-200">${fileObj.name}</span>
            <span class="text-[10px] text-slate-400">${fileObj.channels.length} channels</span>
          </div>
          <button onclick="deleteUploadedFile(${fileObj.id})" class="text-red-500 font-bold bg-red-500/10 px-2 py-0.5 rounded">Delete</button>
        `;
        list.appendChild(item);
      });
    }

    window.deleteUploadedFile = function (fileId) {
      if (confirm("এই প্লেলিস্টটি মুছে ফেলতে চান?")) {
        userUploadedFiles = userUploadedFiles.filter(f => f.id !== fileId);
        selectedFileId = userUploadedFiles.length > 0 ? userUploadedFiles[0].id : null;
        localStorage.setItem('nova_user_files', JSON.stringify(userUploadedFiles));
        renderCategoryCards();
        renderChannels();
        renderUploadedFilesList();
      }
    };

    renderCategoryCards();
    renderChannels();
  </script>
</body>
</html>
